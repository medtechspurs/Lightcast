<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Pulse</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden;
    font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .seg button:disabled { opacity:.35; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:flex-end;
    padding: 0 28px calc(56px + env(safe-area-inset-bottom)); background:#000; }
  #start h1 { font-size: 88px; line-height:.9; font-weight:800; letter-spacing:-.04em; margin:0 0 20px; }
  #start p { font-size:17px; line-height:1.4; margin:0 0 28px; max-width:34ch; color:#cfcfcf; }
  #start .fine { font-size:13px; color:#7a7a7a; margin:16px 0 0; }
  button.big { font: inherit; font-size:19px; font-weight:600; background:#fff; color:#000; border:0;
    border-radius:999px; padding:18px 0; width:100%; }
  button.big:active { transform:scale(.98); }

  #err { position:fixed; inset:0; background:#000; padding:28px; display:flex; align-items:center; font-size:17px; line-height:1.45; }

  #hud { position:fixed; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    display:flex; flex-direction:column; gap:12px; transition:transform .25s ease; }
  #hud.hidden { transform:translateY(110%); }
  .row { display:flex; gap:8px; align-items:center; }
  .row span { font-size:13px; color:#9a9a9a; width:64px; flex:none; }
  .seg { display:flex; gap:6px; flex:1; }
  .seg button { flex:1; font:inherit; font-size:14px; padding:9px 0; border-radius:10px; border:1px solid #333; background:#111; color:#ddd; }
  .seg button.on { background:#fff; color:#000; border-color:#fff; }
  input[type=range] { flex:1; accent-color:#fff; }
  #debug { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:10px; font: 12px/1.5 ui-monospace, Menlo, monospace;
    color:#8f8; background:rgba(0,0,0,.6); padding:8px 10px; border-radius:8px; white-space:pre; pointer-events:none; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) { #hud { transition:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="f" hidden></canvas>

<div id="start">
  <h1>Pulse</h1>
  <p class="fine" style="margin:0 0 20px">Version 0.97</p>
  <p>Your phone listens to the music in the room and turns it into light. Tilt and move it to shape the light.</p>
  <button class="big" id="go">Start</button>
  <p class="fine">Uses the microphone and motion sensors on this phone only. Nothing is recorded or sent anywhere.</p>
</div>

<div id="err" hidden></div>

<div id="hud" class="hidden" hidden>
  <div class="row"><span>Look</span><div class="seg" id="scenes"></div></div>
  <div class="row"><span>Color</span><div class="seg" id="palettes"></div></div>
  <div class="row"><span>Physics</span><div class="seg" id="physics"></div></div>
  <div class="row"><span>Test</span><div class="seg"><button id="tHits">Hits on</button><button id="tSparks">Sparks on</button><button id="tSwirl">Swirl on</button><button id="tStrike">Strike</button></div></div>
  <div class="row"><span>Bright</span><input type="range" id="bright" min="0.15" max="1" step="0.01" value="0.8"></div>
  <div class="row"><span>Feel</span><input type="range" id="sens" min="0.5" max="2" step="0.05" value="1"></div>
  <div class="row"><span></span><div class="seg"><button id="dbg">Show levels</button></div></div>
</div>
<div id="debug" hidden></div>

<div id="errbox" hidden style="position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:99;background:rgba(160,0,0,.85);color:#fff;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-word"></div>
<script>
window.addEventListener('error', e => { const b=document.getElementById('errbox'); b.hidden=false; b.textContent += (e.message||e) + (e.filename ? ' @' + (e.lineno||'') : '') + '\n'; });
window.addEventListener('unhandledrejection', e => { const b=document.getElementById('errbox'); b.hidden=false; b.textContent += 'Promise: ' + (e.reason && (e.reason.message||e.reason)) + '\n'; });
/* ============================================================
   Pulse — layer 1
   Architecture (kept deliberately modular so later layers slot in):
     Signal  : the single normalized state object every scene reads from
     Audio   : mic -> FFT -> bass/mid/high + beat detector + auto-gain
     Motion  : accelerometer/gyro -> tilt, energy, shake
     Gesture : (layer 2 stub) camera hand/face -> Signal.gesture
     Bridge  : (layer 3 stub) sends a compact Signal frame to a relay server
     Scenes  : pure functions of (ctx, Signal, dt) — add new looks here
     UI      : start flow, permissions, controls, wake lock
   ============================================================ */

const Signal = {
  audio:  { level:0, bass:0, mid:0, high:0, beat:false, beatAge:9, bpm:0, beats:0,
            onset:0, centroid:0.5, chroma:new Float32Array(12), key:0, key2:0, keyStrength:0,
            note:false, noteStrength:0, notePc:0, noteOct:0, notes:0, noteLoud:0, hitLoud:0, noteBand:6, bands:new Float32Array(12), gate:0 },
  motion: { tiltX:0, tiltY:0, energy:0, shake:false, spin:0, available:false, ax:0, ay:0, gx:0, gy:1, rz:0, events:0, flick:false, flickStrength:0, flicks:0 },
  gesture:{ available:false, hands:0, open:0 },   // layer 2 fills this
  user:   { bright:0.8, sens:1, palette:0, scene:0, physics:1, noHits:false, noSparks:false, noSwirl:false },
  t:0
};

/* ---------------- Audio ---------------- */
const Audio = {
  ctx:null, analyser:null, db:null, prev:null, bins:null,
  floorDb:-80, ceilDb:-40, quietDb:-70,    // adaptive range for bass level; quietDb = the room's silence floor
  flux:[], fluxT:[], fp:[0,0,0], lastBeat:0, env:[], lastBpmCalc:0,
  nflux:[], nfluxT:[], np:[0,0,0], lastNote:0, nbin:[0,0,0], nFloor:-80, nCeil:-40, nMax:[-100,-100,-100], bassN:[0,0,0],
  async start() {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }, video:false });
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC(); await this.ctx.resume();
    const src = this.ctx.createMediaStreamSource(stream);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048; this.analyser.smoothingTimeConstant = 0.15;
    this.analyser.minDecibels = -100; this.analyser.maxDecibels = -10;
    src.connect(this.analyser);
    const n = this.analyser.frequencyBinCount;
    this.db = new Float32Array(n); this.prev = new Float32Array(n).fill(0);
    this.data = new Uint8Array(n);                       // still used by Bars scene
    const hz = this.ctx.sampleRate / this.analyser.fftSize, b = f => Math.max(1, Math.round(f/hz));
    this.bins = { bass:[b(35), b(250)], mid:[b(250), b(2000)], high:[b(2000), b(8000)], flux:[b(30), b(5000)], lowCut:b(300), chroma:[b(60), b(2500)], note:[b(250), b(5000)] };
    this.hz = hz;
    // 12 log-spaced bands, 40 Hz .. 8 kHz  (band 0 = deepest, 11 = highest) — the clock-face spokes
    this.bandEdges = []; for (let k=0;k<=12;k++) this.bandEdges.push(b(40 * Math.pow(200, k/12)));
    this.bandFloor = new Float32Array(12).fill(-85); this.bandCeil = new Float32Array(12).fill(-45);
    this.pc = new Int8Array(n); for (let i=1;i<n;i++) this.pc[i] = ((Math.round(69 + 12*Math.log2(i*hz/440)) % 12) + 12) % 12;
    try { const tr = stream.getAudioTracks()[0].getSettings(); this.settings = tr; } catch {}
  },
  meanDb(lo, hi) { let s=0; for (let i=lo;i<hi;i++) s += this.db[i]; return s/(hi-lo); },
  update(now) {
    if (!this.analyser) return;
    this.analyser.getFloatFrequencyData(this.db);
    const a = Signal.audio, B = this.bins, sens = Signal.user.sens;

    // --- levels: adaptive dB window. floor tracks quiet moments, ceiling tracks peaks.
    const bassDb = this.meanDb(...B.bass);
    if (isFinite(bassDb)) {
      this.floorDb += (bassDb - this.floorDb) * (bassDb < this.floorDb ? 0.05 : 0.002);
      this.ceilDb  += (bassDb - this.ceilDb)  * (bassDb > this.ceilDb  ? 0.30 : 0.004);
      if (this.ceilDb < this.floorDb + 12) this.ceilDb = this.floorDb + 12;
      const bn = Math.min(1, Math.max(0, (bassDb - this.floorDb) / (this.ceilDb - this.floorDb)));
      this.bassN = [this.bassN[1], this.bassN[2], bn];
      a.bass = Math.pow(bn, 1/sens) * (a.gate !== undefined ? a.gate : 1);
    }
    // --- silence gate: nothing counts unless it is clearly above the quietest the room has been
    let overall = -120; for (let i=B.flux[0]; i<B.flux[1]; i++) if (this.db[i] > overall) overall = this.db[i];   // loudest bin
    if (isFinite(overall) && overall > -119) { this.quietDb += (overall - this.quietDb) * (overall < this.quietDb ? 0.02 : 0.0008); }
    a.gate = Math.min(1, Math.max(0, (overall - this.quietDb - 7) / 10));
    const norm = d => Math.min(1, Math.max(0, (d - this.floorDb) / 50));
    a.mid = norm(this.meanDb(...B.mid)); a.high = norm(this.meanDb(...B.high));
    a.level = (a.bass + a.mid + a.high)/3;

    // --- chroma (pitch-class energy) + spectral centroid
    const ch = this.chromaTmp || (this.chromaTmp = new Float32Array(12)); ch.fill(0);
    let cs=0, cw=0;
    for (let i=B.chroma[0]; i<B.chroma[1]; i++) {
      const m = Math.max(0, (this.db[i] + 100) / 90); const mm = m*m;
      const f = i * this.hz;
      ch[this.pc[i]] += mm; cs += Math.log2(f) * mm; cw += mm;
    }
    if (cw > 0) {
      const c = (cs/cw - Math.log2(100)) / (Math.log2(5000) - Math.log2(100));
      a.centroid += (Math.min(1,Math.max(0,c)) - a.centroid) * 0.08;
      let mx=0; for (let k=0;k<12;k++) mx = Math.max(mx, ch[k]);
      for (let k=0;k<12;k++) a.chroma[k] += (ch[k]/mx - a.chroma[k]) * 0.06;
      let k1=0,k2=0; for (let k=0;k<12;k++) if (a.chroma[k] > a.chroma[k1]) k1=k;
      for (let k=0;k<12;k++) if (k!==k1 && a.chroma[k] > a.chroma[k2]) k2=k;
      a.key = k1; a.key2 = k2; a.keyStrength = a.chroma[k1] - a.chroma[k2];
    }

    // --- onset strength: spectral flux (only increases count), low bins weighted more
    let f=0, nf=0, nbest=0, nbin=0;
    for (let i=B.flux[0]; i<B.flux[1]; i++) {
      const m = Math.max(0, (this.db[i] + 100) / 90);      // 0..1 from dB
      const d = m - this.prev[i]; this.prev[i] = m;
      if (d > 0) { f += d * (i < B.lowCut ? 3 : 1);
        if (i >= B.note[0]) { nf += d; if (d > nbest) { nbest = d; nbin = i; } } }
    }
    // --- per-band levels on their own adaptive windows
    for (let k=0;k<12;k++) {
      const d = this.meanDb(this.bandEdges[k], Math.max(this.bandEdges[k]+1, this.bandEdges[k+1]));
      if (!isFinite(d)) continue;
      this.bandFloor[k] += (d - this.bandFloor[k]) * (d < this.bandFloor[k] ? 0.05 : 0.002);
      this.bandCeil[k]  += (d - this.bandCeil[k])  * (d > this.bandCeil[k]  ? 0.30 : 0.004);
      if (this.bandCeil[k] < this.bandFloor[k] + 14) this.bandCeil[k] = this.bandFloor[k] + 14;
      const v = Math.min(1, Math.max(0, (d - this.bandFloor[k]) / (this.bandCeil[k] - this.bandFloor[k])));
      a.bands[k] += (v*a.gate - a.bands[k]) * 0.35;
    }
    // --- absolute loudness of the loudest note-band bin, on its own adaptive window
    let nMaxDb = -100; for (let i=B.note[0]; i<B.note[1]; i++) if (this.db[i] > nMaxDb) nMaxDb = this.db[i];
    if (isFinite(nMaxDb)) {
      this.nFloor += (nMaxDb - this.nFloor) * (nMaxDb < this.nFloor ? 0.05 : 0.002);
      this.nCeil  += (nMaxDb - this.nCeil)  * (nMaxDb > this.nCeil  ? 0.30 : 0.004);
      if (this.nCeil < this.nFloor + 15) this.nCeil = this.nFloor + 15;
    }
    this.nMax = [this.nMax[1], this.nMax[2], nMaxDb];
    // --- note onsets: mid/high band, fast and sensitive; remember which bin jumped most
    this.nflux.push(nf); this.nfluxT.push(now);
    while (this.nfluxT.length && now - this.nfluxT[0] > 1000) { this.nflux.shift(); this.nfluxT.shift(); }
    let nm=0; for (const v of this.nflux) nm += v; nm /= this.nflux.length || 1;
    let nv=0; for (const v of this.nflux) nv += (v-nm)*(v-nm); const nsd = Math.sqrt(nv/(this.nflux.length||1));
    const nthr = nm + (0.9/sens) * nsd + 0.03;
    this.np = [this.np[1], this.np[2], nf]; this.nbin = [this.nbin[1], this.nbin[2], nbin];
    a.note = false;
    if (a.gate > 0.35 && this.np[1] > nthr && this.np[1] >= this.np[0] && this.np[1] > this.np[2] && now - this.lastNote > 65) {
      a.note = true; a.notes++; this.lastNote = now; Audio.lastNote = now;
      a.noteStrength = Math.min(1, (this.np[1] - nm) / (2.5*nsd + 0.03));
      const ld = Math.max(this.nMax[1], this.nMax[2]);                 // level at/just after the onset
      a.noteLoud = Math.min(1, Math.max(0, (ld - this.nFloor) / (this.nCeil - this.nFloor)));
      const midi = 69 + 12*Math.log2(Math.max(1, this.nbin[1]) * this.hz / 440);
      a.notePc = ((Math.round(midi) % 12) + 12) % 12; a.noteOct = Math.min(1, Math.max(0, (midi - 45) / 48));
      const fq = Math.max(1, this.nbin[1]) * this.hz;
      a.noteBand = Math.min(11, Math.max(1, Math.round(12 * Math.log(fq/40) / Math.log(200))));
    }
    this.flux.push(f); this.fluxT.push(now);
    while (this.fluxT.length && now - this.fluxT[0] > 1200) { this.flux.shift(); this.fluxT.shift(); }
    let m=0; for (const v of this.flux) m += v; m /= this.flux.length || 1;
    let vr=0; for (const v of this.flux) vr += (v-m)*(v-m); const sd = Math.sqrt(vr/(this.flux.length||1));
    const thr = m + (1.2/sens) * sd + 0.02;

    // local peak pick with one-frame delay: fp = [two ago, one ago, now]
    this.fp = [this.fp[1], this.fp[2], f];
    a.beat = false;
    const [p2,p1,p0] = this.fp;
    if (a.gate > 0.35 && p1 > thr && p1 >= p2 && p1 > p0 && now - this.lastBeat > 120) {
      a.beat = true; a.beats++; this.lastBeat = now;
      a.onset = Math.min(1, (p1 - m) / (3*sd + 0.05));     // how sudden the hit was, 0..1
      a.hitLoud = Math.max(this.bassN[1], this.bassN[2]);   // how loud it was, 0..1
    }
    a.beatAge = (now - this.lastBeat)/1000;

    // --- BPM: autocorrelation of onset envelope over last 6 s, 70–180 BPM
    this.env.push([now, f]);
    while (this.env.length && now - this.env[0][0] > 6000) this.env.shift();
    if (now - this.lastBpmCalc > 1000 && this.env.length > 120) {
      this.lastBpmCalc = now;
      const step = 10, N = 600, e = new Float32Array(N), t0 = now - 6000;
      for (const [t,v] of this.env) { const k = Math.floor((t - t0)/step); if (k>=0 && k<N) e[k] = Math.max(e[k], v); }
      let mean=0; for (let i=0;i<N;i++) mean+=e[i]; mean/=N; for (let i=0;i<N;i++) e[i]-=mean;
      let best=-1, bestLag=0;
      for (let lag=33; lag<=86; lag++) {            // 333 ms .. 857 ms
        let c=0; for (let i=lag;i<N;i++) c += e[i]*e[i-lag];
        c /= (N-lag);
        // mild preference for lags whose double also correlates (suppresses half-time errors)
        let c2=0; if (lag*2 < N) { for (let i=lag*2;i<N;i++) c2 += e[i]*e[i-lag*2]; c2 /= (N-lag*2); }
        const score = c + 0.5*c2;
        if (score > best) { best = score; bestLag = lag; }
      }
      if (best > 0) { const bpm = Math.round(60000/(bestLag*step)); a.bpm = a.bpm ? Math.round(a.bpm*0.5 + bpm*0.5) : bpm; }
    }
    this.lastBassDb = bassDb;
  }
};

/* ---------------- Motion ---------------- */
// iOS reports acceleration and gravity with the sign flipped relative to the spec/Android.
// Internally we use the spec convention: phone upright -> gy = +1 (points 'up'); moving right -> ax > 0.
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SGN = IOS ? -1 : 1;
const Motion = {
  eNorm:0, bx:0, by:0, hist:[], lastFlick:0,
  async start() {
    if (typeof DeviceMotionEvent === 'undefined') return;
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      try { if (await DeviceMotionEvent.requestPermission() !== 'granted') return; } catch { return; }
    }
    window.addEventListener('devicemotion', e => this.onMotion(e));
    Signal.motion.available = true;
  },
  onMotion(e) {
    const m = Signal.motion, g = e.accelerationIncludingGravity, a = e.acceleration, r = e.rotationRate;
    if (g) { m.tiltX += ((g.x||0)/9.81 - m.tiltX)*0.15; m.tiltY += ((g.y||0)/9.81 - m.tiltY)*0.15; }
    if (g) { m.gx += (SGN*(g.x||0)/9.81 - m.gx)*0.2; m.gy += (SGN*(g.y||0)/9.81 - m.gy)*0.2; }
    if (a) { const rx = SGN*(a.x||0)/9.81, ry = SGN*(a.y||0)/9.81, rz = SGN*(a.z||0)/9.81;
      // --- flick: a sharp spike, then a sharp spike the opposite way within ~250 ms (drumstick stroke)
      const t = performance.now(), fm = Math.hypot(rx, ry, rz);
      this.hist.push([t, rx, ry, rz, fm]); while (this.hist.length && t - this.hist[0][0] > 320) this.hist.shift();
      if (fm > 0.45 && t - this.lastFlick > 350) {
        let best = null;
        for (const h of this.hist) { if (t - h[0] < 50 || h[4] < 0.6) continue;
          const dot = (h[1]*rx + h[2]*ry + h[3]*rz) / (h[4]*fm);
          if (dot < -0.4 && (!best || h[4] > best[4])) best = h; }
        if (best) { this.lastFlick = t; m.flick = true; m.flicks++;
          m.flickStrength = Math.min(1, (best[4] + fm - 1.0) / 2.2); }
      }
      this.bx += (rx - this.bx)*0.002; this.by += (ry - this.by)*0.002;        // very slow bias estimate
      const dz = v => Math.abs(v) < 0.02 ? 0 : v - Math.sign(v)*0.02;          // dead zone
      m.ax += (dz(rx - this.bx) - m.ax)*0.3; m.ay += (dz(ry - this.by) - m.ay)*0.3;
      const mag = Math.hypot(a.x||0, a.y||0, a.z||0) / 9.81;   // in g
      const n = Math.min(1, mag / 1.5);
      m.energy += (n - m.energy) * (n > m.energy ? 0.5 : 0.06);
      m.shake = n > 0.55 * (1/Signal.user.sens); }
    if (r) { const s = Math.hypot(r.alpha||0, r.beta||0, r.gamma||0) / 360; m.spin += (Math.min(1,s) - m.spin)*0.2;
      m.rz += (SGN*(r.alpha||0)/180 - m.rz)*0.4; }                                   // twist around the screen normal, half-turns/s
    m.events++;
  }
};

/* ---------------- Gesture (layer 2 stub) ---------------- */
// Later: load MediaPipe Hands/FaceMesh, run on the front camera at low fps,
// write Signal.gesture.hands / .open and set .available = true. Scenes already read it.
const Gesture = { start(){}, update(){} };

/* ---------------- Bridge (layer 3 stub) ---------------- */
// Add ?relay=wss://your-relay.example to the URL and this will stream a compact frame
// ~5x/sec. Server aggregates across phones -> MIDI/DAW. No-op when no relay is set.
const Bridge = {
  url: new URLSearchParams(location.search).get('relay'), ws:null, last:0,
  start() { if (!this.url) return; try { this.ws = new WebSocket(this.url); } catch {} },
  update(now) {
    if (!this.ws || this.ws.readyState !== 1 || now - this.last < 200) return;
    this.last = now; const a = Signal.audio, m = Signal.motion;
    this.ws.send(JSON.stringify({ t:Math.round(now), bass:+a.bass.toFixed(3), beat:a.beats,
      energy:+m.energy.toFixed(3), tx:+m.tiltX.toFixed(2), ty:+m.tiltY.toFixed(2), shake:m.shake?1:0 }));
  }
};


/* ---------------- Fluid (GPU smoke) ---------------- */
// Stable-fluids solver on WebGL2. Music injects hot gas at the center; phone motion is the
// wind that pushes it around; tilt gives it a "rise" direction. Falls back to 2D scenes if unavailable.
const Fluid = {
  ok:false, gl:null, cv:null, bright:0.8, lastHue:0, puffs:[], jets:[],
  init() {
    this.cv = document.getElementById('f');
    const gl = this.cv.getContext('webgl2', { alpha:false, antialias:false, depth:false, stencil:false, preserveDrawingBuffer:false, powerPreference:'high-performance' });
    if (!gl) return false;
    if (!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'))) return false;
    this.gl = gl;
    const V = `precision highp float; attribute vec2 aPosition; varying vec2 vUv,vL,vR,vT,vB; uniform vec2 texelSize;

      for (let i=rings.length-1;i>=0;i--) { const k=rings[i]; k.r += (W*1.2)*dt; k.a -= 1.6*dt;
        if (k.a<=0) { rings.splice(i,1); continue; }
        ctx.strokeStyle = hsl(k.h,100,65,k.a); ctx.beginPath(); ctx.arc(cx,cy,k.r,0,Math.PI*2); ctx.stroke(); }
      if (m.shake || (Signal.gesture.available && Signal.gesture.open > 0.7)) for (let i=0;i<6;i++) {
        const t=Math.random()*Math.PI*2, s=(200+600*Math.random());
        sparks.push({ x:cx, y:cy, vx:Math.cos(t)*s, vy:Math.sin(t)*s, a:1, h:hue(i) }); }
      for (let i=sparks.length-1;i>=0;i--) { const s=sparks[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.a-=1.2*dt;
        if (s.a<=0) { sparks.splice(i,1); continue; }
        ctx.fillStyle = hsl(s.h,100,70,s.a); ctx.beginPath(); ctx.arc(s.x,s.y,4,0,Math.PI*2); ctx.fill(); }
    } },
  { name:'Strobe', draw(ctx, W, H, dt) {
      const a = Signal.audio, m = Signal.motion;
      const flash = Math.max(0, 1 - a.beatAge*6);           // sharp hit, fast decay
      const base = 0.06 + 0.25*a.bass + 0.2*m.energy;
      ctx.fillStyle = hsl(hue(a.beats), 100, 8 + 40*base + 50*flash);
      ctx.fillRect(0,0,W,H);
      if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash*0.9})`; ctx.fillRect(0,0,W,H); }
    } },
  { name:'Bars', draw(ctx, W, H, dt) {
      const a = Signal.audio, m = Signal.motion, n = 24;
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H);
      Audio.analyser && Audio.analyser.getByteFrequencyData(Audio.data);
      const step = Math.floor(Audio.bins ? Audio.bins.high[1] / n : 4);
      const w = W / n, skew = m.tiltX * 0.6;
      for (let i=0;i<n;i++) { let s=0; for (let j=0;j<step;j++) s += Audio.data ? Audio.data[i*step+j] : 0;
        const v = Math.min(1, (s/(step*255)) * 1.6 * Signal.user.sens);
        const h = H * v * (0.5 + 0.5*a.bass + 0.3*m.energy);
        ctx.fillStyle = hsl(hue(i)+i*3, 100, 55, 0.9);
        ctx.fillRect(i*w + 1, H - h, w - 2 + skew*i, h); }
      if (a.beat) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0,0,W,H); }
    } }
];

/* ---------------- Render loop ---------------- */
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W=0, H=0, last=0, fps=0;
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  // edge fade so the phone's outline disappears in the dark
  const r = Math.hypot(W,H)/2;
  vignette = ctx.createRadialGradient(W/2,H/2,r*0.50, W/2,H/2,r*0.92);
  vignette.addColorStop(0,'rgba(0,0,0,0)'); vignette.addColorStop(1,'rgba(0,0,0,1)');
}
let vignette = null;
addEventListener('resize', () => { resize(); if (Fluid.ok) Fluid.alloc(); });

function frame(now) {
  const dt = Math.min(0.05, (now - last)/1000 || 0.016); last = now; Signal.t = now;
  fps += (1/dt - fps)*0.05; drift += dt;
  Audio.update(now); Gesture.update(now);
  const sc = Scenes[Signal.user.scene];
  if (sc.gl && Fluid.ok) { if (canvas.style.display!=='none') { canvas.style.display='none'; Fluid.cv.hidden=false; } Fluid.step(dt, now); }
  else { if (canvas.style.display==='none') { canvas.style.display=''; Fluid.cv.hidden=true; }
    if (sc.gl) { ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); } else sc.draw(ctx, W, H, dt);
    if (vignette) { ctx.fillStyle = vignette; ctx.fillRect(0,0,W,H); } }
  Bridge.update(now);
  if (!debugEl.hidden) debugEl.textContent =
    `bass ${Signal.audio.bass.toFixed(2)}  lvl ${Signal.audio.level.toFixed(2)}  gate ${Signal.audio.gate.toFixed(2)}  quiet ${Audio.quietDb.toFixed(0)}dB\n` +
    `beats ${Signal.audio.beats}  notes ${Signal.audio.notes}  lastSpoke ${Signal.audio.noteBand}  bpm ${Signal.audio.bpm}\n` +
    `bands ${Array.from(Signal.audio.bands).map(v=>Math.round(v*9)).join('')}\n` +
    `energy ${Signal.motion.energy.toFixed(2)}  shake ${Signal.motion.shake?'Y':'-'}\n` +
    `tilt ${Signal.motion.tiltX.toFixed(2)},${Signal.motion.tiltY.toFixed(2)}  motion ${Signal.motion.available?'ok':'none'}${IOS?' ios':''}\n` +
    `flicks ${Signal.motion.flicks}  strikes ${Fluid.strikes||0}  charge ${Fluid.meanCharge==null?'-':Fluid.meanCharge.toFixed(4)}  acc ${Signal.motion.ax.toFixed(2)},${Signal.motion.ay.toFixed(2)}  grav ${Signal.motion.gx.toFixed(2)},${Signal.motion.gy.toFixed(2)}  twist ${Signal.motion.rz.toFixed(2)}  ev ${Signal.motion.events}\n` +
    `v0.97  fps ${fps.toFixed(0)}  sr ${Audio.ctx?Audio.ctx.sampleRate:0}\n` +
    `culprit ${Fluid.traceWho||'-'}  jump ${(Fluid.traceMax||0).toFixed(0)}\n` +
    `intensity ${(Fluid.intensity||0).toFixed(2)}  meanV ${Fluid.meanV ? Fluid.meanV.map(v=>v.toFixed(1)).join(',') : (Fluid.measureErr||'n/a')}  peak ${Fluid.peakV ? Fluid.peakV.map(v=>v.toFixed(0)).join(',') : '-'}  nan ${Fluid.nanCount||0}\n` +
    `key ${['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][Signal.audio.key]}  bright ${Signal.audio.centroid.toFixed(2)}  hitLoud ${Signal.audio.hitLoud.toFixed(2)}  noteLoud ${Signal.audio.noteLoud.toFixed(2)}\n` +
    `bassDb ${(Audio.lastBassDb||0).toFixed(0)}  floor ${Audio.floorDb.toFixed(0)}  ceil ${Audio.ceilDb.toFixed(0)}\n` +
    `mic ${Audio.settings ? ('ns='+Audio.settings.noiseSuppression+' agc='+Audio.settings.autoGainControl+' ec='+Audio.settings.echoCancellation) : '?'}`;
  requestAnimationFrame(frame);
}

/* ---------------- UI ---------------- */
const startEl = document.getElementById('start'), errEl = document.getElementById('err'),
      hud = document.getElementById('hud'), debugEl = document.getElementById('debug');
let wake = null, hudTimer = null;

async function keepAwake() {
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); Audio.ctx && Audio.ctx.resume(); }
});

function showHud(on) {
  hud.classList.toggle('hidden', !on); clearTimeout(hudTimer);
  if (on) hudTimer = setTimeout(() => hud.classList.add('hidden'), 5000);
}
canvas.addEventListener('pointerdown', () => showHud(hud.classList.contains('hidden')));
hud.addEventListener('pointerdown', () => showHud(true));

function seg(id, items, key) {
  const box = document.getElementById(id);
  items.forEach((it, i) => { const b = document.createElement('button'); b.textContent = it.name;
    if (i === Signal.user[key]) b.classList.add('on');
    b.onclick = () => { Signal.user[key] = i; [...box.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); };
    box.appendChild(b); });
}
seg('scenes', Scenes, 'scene'); seg('palettes', Palettes, 'palette'); seg('physics', [{name:'Off'},{name:'Calm'},{name:'Full'}], 'physics');
document.getElementById('bright').oninput = e => { Signal.user.bright = +e.target.value; canvas.style.opacity = Signal.user.bright; document.getElementById('f').style.opacity = Signal.user.bright; };
document.getElementById('sens').oninput = e => Signal.user.sens = +e.target.value;
[['tHits','noHits','Hits'],['tSparks','noSparks','Sparks'],['tSwirl','noSwirl','Swirl']].forEach(([id,key,lab]) => {
  document.getElementById(id).onclick = e => { Signal.user[key] = !Signal.user[key]; e.target.textContent = lab + (Signal.user[key] ? ' OFF' : ' on'); e.target.classList.toggle('on', Signal.user[key]); }; });
document.getElementById('tStrike').onclick = () => { Signal.motion.flick = true; Signal.motion.flickStrength = 1; };
document.getElementById('dbg').onclick = e => { debugEl.hidden = !debugEl.hidden; e.target.textContent = debugEl.hidden ? 'Show levels' : 'Hide levels'; };

document.getElementById('go').onclick = async () => {
  const go = document.getElementById('go'); go.disabled = true; go.textContent = 'Starting…';
  try {
    await Motion.start();          // must happen inside the tap on iOS
    await Audio.start();           // also needs the tap for AudioContext
  } catch (e) {
    startEl.hidden = true; errEl.hidden = false;
    errEl.textContent = (e && e.name === 'NotAllowedError')
      ? 'Microphone access was blocked. Reload the page and tap Allow when asked for the microphone.'
      : 'Could not start the microphone (' + (e && e.message || e) + '). Make sure the page is opened over https and try again.';
    return;
  }
  Gesture.start(); Bridge.start();
  startEl.hidden = true; hud.hidden = false;
  resize(); canvas.style.opacity = Signal.user.bright; keepAwake();
  try { if (!Fluid.init()) throw new Error('GPU setup failed (no WebGL2 float buffers)'); } catch (e) { const b=document.getElementById('errbox'); b.hidden=false; b.textContent += 'Smoke disabled: ' + (e && (e.message||e)) + '\n'; Signal.user.scene = 1; document.querySelectorAll('#scenes button')[0].disabled = true; document.querySelectorAll('#scenes button')[1].classList.add('on'); document.querySelectorAll('#scenes button')[0].classList.remove('on'); }
  document.getElementById('f').style.opacity = Signal.user.bright;
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  requestAnimationFrame(frame); showHud(true);
};
resize();
</script>
</body>
</html>
